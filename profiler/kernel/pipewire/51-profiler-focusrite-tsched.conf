# profiler (D0017 in profiler/plans/kernel-plan.md): timer scheduling for the Focusrite Scarlett 2i4's pro-audio nodes.
# PipeWire's pro-audio profile drives the card from its period interrupt (api.alsa.disable-tsched = true), and
# snd-usb-audio completes the high-speed stream's 125 us packets in 0.5 ms transfers, so a 64-frame period (1.333 ms)
# ends on a 0.5 ms boundary and the graph's cycles alternate 1.0, 1.5, 1.5 ms (D0016): every third cycle gives Live
# 1.0 ms. With timer scheduling PipeWire wakes once a quantum from its own timer, kept on the card's clock by its DLL;
# the headroom covers the hardware pointer's 0.5 ms (24-frame) steps. Installed into
# ~/.config/wireplumber/wireplumber.conf.d and removed by profiler/kernel/pipewire/focusrite-tsched.sh.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Focusrite_Scarlett_2i4_USB.*" }
      { node.name = "~alsa_output.usb-Focusrite_Scarlett_2i4_USB.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = false
        api.alsa.headroom = 32
      }
    }
  }
]

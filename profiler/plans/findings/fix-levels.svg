<title id="t">Ableton Live 12: Live CPU, audio worker CPU and dropouts, Linux (Wine) against Windows 11</title>
<desc id="d">Linux, upstream setup: Live CPU 63.8/68.2/60.3 %, audio worker CPU 51.3/55.4/50.0 % (Inbuilts/Max4Live/VSTs), 15 workers, 55 missed deadlines, 176 PipeWire errors; Windows 11, Focusrite ASIO: Live CPU 33.0/33.2/23.8 %, audio worker CPU 28.2/29.5/19.6 % (Inbuilts/Max4Live/VSTs), 5 workers, 2 missed deadlines; Linux with the current fixes: Live CPU 27.3/29.6/22.8 %, audio worker CPU 15.4/16.4/12.3 % (Inbuilts/Max4Live/VSTs), 2 workers, 0 missed deadlines, 0 PipeWire errors.</desc>

<text x="740.0" y="610.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="end">0</text>
<text x="892.0" y="610.0" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="end">0</text>
<text x="28.0" y="654.0" font-size="11" fill="#59636e">Missed deadline: an audio block that took Live longer than its buffer period to compute (its DSP meter over 100 % during playback).</text>
<text x="28.0" y="670.0" font-size="11" fill="#59636e">PipeWire error: a cycle in which Live's audio reached the interface late. Windows has no PipeWire, so there are none to count there.</text>
<text x="28.0" y="686.0" font-size="11" fill="#59636e">Current fixes: posix_spawn for new processes, a realtime driver callback thread, one audio thread per physical P-core, a new display path,</text>
<text x="28.0" y="702.0" font-size="11" fill="#59636e">shallow CPU idle (C1E off; C2/C3 off on the P-cores) and a buffer aligned to the interface's 0.5 ms USB transfers.</text>
<text x="28.0" y="718.0" font-size="11" fill="#59636e">Each setup ran with the worker count in the table. Measured 2026-10-19 (upstream, Windows) and 2026-10-20 (current fixes).</text>
<text x="28.0" y="734.0" font-size="11" fill="#59636e">Data: profiler/plans/findings in github.com/colbylippert/ableton-linux, runs D0006 (upstream), D0005 (Windows) and D0018 (current fixes).</text>

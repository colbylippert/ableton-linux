k1v    url=https://nilsschneider.de/files/K1v.zip                                            sha256=32bdb421efb951ff9965786932cbad40b0fe57a3f03e0810d3bee89f51f27a46  member=K1v_x64.vst3  kind=file    version=1.26   size=12991595  license=freeware

# ~/.config/pipewire/pipewire.conf.d/90-profiler-null-sink.conf — written by profiler/setup/phases/06-audio.sh
# A virtual stereo sink at 48 kHz for PipeASIO (output_device = profiler-null):
# Live's audio never depends on real hardware, and the graph clock is ours.
context.objects = [
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "profiler-null"
             node.description = "Profiler null sink"  media.class = Audio/Sink
             object.linger = true  audio.position = [ FL FR ]  audio.rate = 48000
             monitor.channel-volumes = true } }
]

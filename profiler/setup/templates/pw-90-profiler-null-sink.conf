# ~/.config/pipewire/pipewire.conf.d/90-profiler-null-sink.conf — written by profiler/setup/phases/06-audio.sh
# A virtual stereo sink at 48 kHz, node.name "profiler-null". PipeASIO uses it
# only with --audio-device null (the vm profile's default) or in tests; on bare
# metal PipeASIO drives a real device (audio_node in ~/.config/profiler/setup.conf,
# the built-in speaker sink by default) so the graph runs on a hardware clock.
context.objects = [
  { factory = adapter
    args = { factory.name = support.null-audio-sink  node.name = "profiler-null"
             node.description = "Profiler null sink"  media.class = Audio/Sink
             object.linger = true  audio.position = [ FL FR ]  audio.rate = 48000
             monitor.channel-volumes = true } }
]

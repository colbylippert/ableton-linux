# /etc/systemd/logind.conf.d/90-profiler-lid.conf — written by
# profiler/setup/phases/05-session.sh (laptops). Closing the lid on external
# power, or docked, must not suspend the profiler machine: Live, the tracer and
# the SSH session keep running. On battery logind's HandleLidSwitch= (suspend)
# still applies. While a Plasma session runs, PowerDevil holds logind's
# handle-lid-switch inhibitor and applies its own [AC] LidAction (phase 05 sets
# it to 0, "do nothing", in ~/.config/powerdevilrc); this file covers the
# greeter and the time without a session. Applied with
# `systemctl kill -s HUP systemd-logind` (a restart would end the session).
# Delete this file to revert.
[Login]
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

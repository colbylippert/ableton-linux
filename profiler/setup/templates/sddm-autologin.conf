# zz-profiler-autologin.conf — written by profiler/setup/phases/05-session.sh (--autologin)
# Drop-in for SDDM (/etc/sddm.conf.d/) or Plasma Login Manager
# (/etc/plasmalogin.conf.d/): log @@USER@@ straight into the Plasma Wayland
# session at boot and again after every logout, so Live always has a display.
# The main file (/etc/sddm.conf or /etc/plasmalogin.conf) overrides drop-ins;
# phase 05 patches a conflicting [Autologin] section there (backup *.profiler-bak).
[Autologin]
User=@@USER@@
Session=@@SESSION_NAME@@
Relogin=true

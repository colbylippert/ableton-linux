# /etc/security/limits.d/90-profiler.conf — written by profiler/setup/phases/04-limits.sh
# Open-file limit for the profiler user: BPF ring buffers, podman builds and the
# dashboard's node processes open many descriptors. The realtime limits come
# from scripts/setup-realtime.sh (90-ableton-rt.conf); pam_limits lets a user
# line win over @group lines regardless of file order.
@@USER@@   -   nofile   524288

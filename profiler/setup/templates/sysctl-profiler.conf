# /etc/sysctl.d/90-profiler.conf — written by profiler/setup/phases/04-limits.sh (vm profile only)
# Let the unprivileged profiler user open perf events and uprobes and read
# kernel pointers (BPF stack traces). Sorts after 70-cachyos-settings.conf,
# which sets kernel.kptr_restrict = 2, so these values win.
# The baremetal profile does not install this file: the root helper sets the
# knobs for one run and `profiler-root-helper reset` restores the baseline.
kernel.perf_event_paranoid = -1
kernel.kptr_restrict = 0

# /etc/sysctl.d/90-profiler.conf — written by profiler/setup/phases/04-limits.sh
# Let the unprivileged profiler user open perf events and uprobes and read
# kernel pointers (BPF stack traces, perf symbolisation). Installed on every
# profile: the profiler machines (the VM, the dedicated laptop) run nothing
# else. Sorts after 70-cachyos-settings.conf, which sets kernel.kptr_restrict = 2,
# so these values win. profiler-root-helper's baseline (taken in phase 01, before
# this file existed) records the distribution values; `profiler-root-helper
# reset` restores them and then re-applies this drop-in (sysctl --system).
# Delete this file to revert (in effect from the next boot).
kernel.perf_event_paranoid = -1
kernel.kptr_restrict = 0

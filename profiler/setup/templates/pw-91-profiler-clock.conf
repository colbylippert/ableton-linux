# ~/.config/pipewire/pipewire.conf.d/91-profiler-clock.conf — written by profiler/setup/phases/06-audio.sh
# Graph clock limits: PipeASIO requests buffers down to 32 frames, and the
# distribution default min-quantum (1024 on CachyOS) would silently pin every
# request to 1024. Quantum 256 is the idle default; PipeASIO forces its own.
context.properties = {
  default.clock.rate = 48000  default.clock.allowed-rates = [ 48000 ]
  default.clock.quantum = 256  default.clock.min-quantum = 32  default.clock.max-quantum = 2048
}

# /etc/NetworkManager/conf.d/90-profiler-wifi-powersave.conf — written by
# profiler/setup/phases/05-session.sh on machines with Wi-Fi. Power saving adds
# ~100 ms latency spikes to the SSH link and extra interrupt jitter on the
# measurement machine. 2 = disable, for every Wi-Fi connection whose own
# 802-11-wireless.powersave is "default". NetworkManager re-reads this file on
# `nmcli general reload conf` (never restarted: the SSH session may run over
# Wi-Fi) and applies it at the next (re)connection; phase 05 also turns power
# saving off right away with `iw dev <if> set power_save off`. Delete to revert.
[connection]
wifi.powersave = 2

# zz-profiler-autologin.conf — written by profiler/setup/phases/05-session.sh (--autologin)
# Log @@USER@@ straight into the Plasma Wayland session at boot and again after
# every logout, so Live always has a display. Phase 05 detects the display
# manager:
#   * Plasma Login Manager (plasmalogin.service): the [Autologin] keys below are
#     set in /etc/plasmalogin.conf itself, in place (other keys and sections are
#     kept; the first change leaves /etc/plasmalogin.conf.profiler-bak)
#   * SDDM: this file is installed as /etc/sddm.conf.d/zz-profiler-autologin.conf;
#     an [Autologin] section in /etc/sddm.conf (read last, so it wins) gets the
#     same keys in place (backup /etc/sddm.conf.profiler-bak)
#   * any other display manager: nothing is changed (warning)
[Autologin]
User=@@USER@@
Session=@@SESSION_NAME@@
Relogin=true

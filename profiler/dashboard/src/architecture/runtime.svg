<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" viewBox="0 0 1160 852" role="img" aria-label="Runtime stack on the laptop. Ableton Live and its plug-ins call through Wine's PE DLLs and cross into Wine's Linux side at the syscall dispatcher and the unix-call dispatcher, then reach wineserver or the NTSync driver. The PipeASIO driver, a winelib DLL, calls Live's audio engine once per block from the PipeWire graph and the Focusrite. Diamonds mark the trace points; each hit runs a small BPF program, and the reducer and symbolizer join the records to audio blocks and name the callers.">
  <!-- Figure 1. Classes only, no colours: styled by architecture.css (dashboard) or the snapshot page. -->
  <defs>
    <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path class="mk" d="M0 1 L10 5 L0 9 z"/></marker>
    <marker id="f1aa" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path class="mka" d="M0 1 L10 5 L0 9 z"/></marker>
  </defs>

  <!-- layer bands -->
  <rect class="ba" x="20" y="20" width="700" height="176"/>
  <rect class="bb" x="20" y="196" width="700" height="142"/>
  <rect class="ba" x="20" y="338" width="700" height="102"/>
  <rect class="bb" x="20" y="455" width="1120" height="137"/>
  <rect class="ba" x="20" y="605" width="700" height="57"/>
  <text class="tb" text-anchor="middle" transform="translate(35 108) rotate(-90)">WINDOWS CODE</text>
  <text class="tb" text-anchor="middle" transform="translate(35 267) rotate(-90)">WINE · LINUX SIDE</text>
  <text class="tb" text-anchor="middle" transform="translate(35 389) rotate(-90)">SERVICES</text>
  <text class="tb" text-anchor="middle" transform="translate(35 523) rotate(-90)">KERNEL</text>
  <text class="tb" text-anchor="middle" transform="translate(35 633) rotate(-90)">HW</text>

  <!-- Live -->
  <rect class="boxe" x="48" y="46" width="652" height="72" rx="6"/>
  <text class="tt" x="60" y="64">Ableton Live 12.4.6 Trial</text>
  <text class="ts" x="252" y="64">Windows build, unmodified · runs inside the Wine prefix</text>
  <rect class="cb" x="60" y="74" width="138" height="36" rx="4"/>
  <text x="129" y="89" text-anchor="middle">main thread</text>
  <text class="ts" x="129" y="103" text-anchor="middle">UI · windows · loading</text>
  <rect class="cb" x="208" y="74" width="122" height="36" rx="4"/>
  <text x="269" y="89" text-anchor="middle">plug-ins</text>
  <text class="ts" x="269" y="103" text-anchor="middle">Dexed · K1v (VST3)</text>
  <rect class="cb" x="340" y="74" width="120" height="36" rx="4"/>
  <text x="400" y="89" text-anchor="middle">AbletonOSC</text>
  <text class="ts" x="400" y="103" text-anchor="middle">remote script</text>
  <rect class="cb" x="470" y="74" width="218" height="36" rx="4"/>
  <text x="579" y="89" text-anchor="middle">audio engine</text>
  <text class="ts" x="579" y="103" text-anchor="middle">AudioCalc × 15 worker threads</text>
  <line class="ed" x1="400" y1="45" x2="400" y2="25" marker-start="url(#f1a)" marker-end="url(#f1a)"/>
  <text class="ts" x="410" y="38">UDP 11000 / 11001 · bench suite (Fig. 2)</text>

  <!-- Wine PE side -->
  <rect class="box" x="48" y="140" width="372" height="46" rx="5"/>
  <text class="tt" x="60" y="159">Wine PE DLLs</text>
  <text class="tm" x="60" y="176">kernelbase · user32 · win32u · ntdll.dll</text>
  <line class="e" x1="234" y1="119" x2="234" y2="138" marker-end="url(#f1a)"/>
  <text class="ts" x="244" y="133">Win32 · NT API calls</text>

  <!-- PipeASIO is a winelib DLL: PE-callable code that links libpipewire, so it straddles both layers -->
  <rect class="boxe" x="470" y="140" width="230" height="184" rx="5"/>
  <text class="tt" x="482" y="160">PipeASIO driver</text>
  <text class="tm" x="482" y="177">pipeasio64.dll.so</text>
  <text class="ts" x="482" y="201">winelib: loads like a Windows DLL</text>
  <text class="ts" x="482" y="216">and links libpipewire directly</text>
  <text class="ts" x="482" y="240">its callback thread calls Live's</text>
  <text class="ts" x="482" y="255">bufferSwitch once per block</text>
  <polygon class="pr" points="488,303 494,309 488,315 482,309"/>
  <text class="tp" x="500" y="313">pipeasio:cycle_* · block_*</text>
  <line class="e" x1="579" y1="139" x2="579" y2="120" marker-end="url(#f1a)"/>
  <text class="ts" x="589" y="133">ASIO bufferSwitch per block</text>

  <!-- crossings 1 and 2 -->
  <line class="e" x1="110" y1="187" x2="110" y2="248" marker-end="url(#f1a)"/>
  <polygon class="pr" points="110,202 116,208 110,214 104,208"/>
  <text x="122" y="206">① syscall dispatcher</text>
  <text class="tp" x="122" y="220">wine:syscall_entry/exit</text>
  <line class="e" x1="290" y1="187" x2="290" y2="248" marker-end="url(#f1a)"/>
  <polygon class="pr" points="290,202 296,208 290,214 284,208"/>
  <text x="302" y="206">② unix-call dispatcher</text>
  <text class="tp" x="302" y="220">wine:unixcall_entry/exit</text>

  <!-- Wine Linux side -->
  <rect class="box" x="48" y="250" width="372" height="50" rx="5"/>
  <text class="tt" x="60" y="270">Wine, Linux side</text>
  <text class="tm" x="60" y="288">ntdll.so · win32u.so · winex11.so</text>

  <!-- crossings 3 and 4 -->
  <line class="e" x1="140" y1="301" x2="140" y2="358" marker-end="url(#f1a)"/>
  <polygon class="pr" points="140,316 146,322 140,328 134,322"/>
  <text x="152" y="320">③ server request</text>
  <text class="tp" x="152" y="334">wine:server_*</text>
  <line class="e" x1="345" y1="301" x2="345" y2="483" marker-end="url(#f1a)"/>
  <polygon class="pr" points="345,346 351,352 345,358 339,352"/>
  <text x="357" y="350">④ NTSync wait/wake</text>
  <text class="tp" x="357" y="364">fentry ntsync_*</text>

  <!-- services -->
  <rect class="box" x="48" y="360" width="202" height="50" rx="5"/>
  <text class="tt" x="60" y="380">wineserver</text>
  <text class="ts" x="60" y="397">objects · messages · waits</text>
  <rect class="box" x="470" y="360" width="230" height="50" rx="5"/>
  <text class="tt" x="482" y="380">PipeWire 1.6.9 graph</text>
  <text class="tm" x="482" y="397">quantum 64 · 48 kHz</text>
  <line class="ea" x1="579" y1="326" x2="579" y2="358" marker-start="url(#f1aa)" marker-end="url(#f1aa)"/>
  <text class="ts" x="589" y="346">pw_filter process</text>
  <line class="ea" x1="579" y1="412" x2="579" y2="483" marker-start="url(#f1aa)" marker-end="url(#f1aa)"/>
  <text class="ts" x="589" y="449">ALSA PCM</text>

  <!-- kernel -->
  <rect class="box" x="48" y="485" width="182" height="50" rx="5"/>
  <text class="tt" x="60" y="505">uprobes</text>
  <text class="ts" x="60" y="522">trap at every USDT site</text>
  <rect class="box" x="250" y="485" width="190" height="50" rx="5"/>
  <text class="tt" x="262" y="505">ntsync driver</text>
  <text class="tm" x="262" y="522">/dev/ntsync</text>
  <rect class="box" x="470" y="485" width="230" height="50" rx="5"/>
  <text class="tt" x="482" y="505">ALSA · snd-usb-audio</text>
  <text class="ts" x="482" y="522">USB audio class driver</text>
  <rect class="box" x="715" y="485" width="150" height="50" rx="5"/>
  <text class="tt" x="727" y="505">scheduler</text>
  <text class="ts" x="727" y="522">switch · wake · fork</text>
  <rect class="boxe" x="880" y="485" width="250" height="50" rx="5"/>
  <text class="tt" x="892" y="505">BPF programs</text>
  <text class="ts" x="892" y="522">small programs · stack &lt; 64 B</text>
  <path class="e" d="M139 536 V562 H945"/>
  <line class="e" x1="345" y1="536" x2="345" y2="562"/>
  <line class="e" x1="790" y1="536" x2="790" y2="562"/>
  <line class="e" x1="945" y1="562" x2="945" y2="537" marker-end="url(#f1a)"/>
  <text class="ts" x="150" y="582">probe hits: USDT traps · ntsync fentry/fexit · sched tracepoints</text>
  <line class="ea" x1="579" y1="537" x2="579" y2="610" marker-start="url(#f1aa)" marker-end="url(#f1aa)"/>
  <text class="ts" x="589" y="600">USB · device clock</text>

  <!-- hardware -->
  <rect class="box" x="48" y="612" width="202" height="44" rx="5"/>
  <text class="tt" x="60" y="630">Intel i7-13620H</text>
  <text class="ts" x="60" y="646">6 P + 4 E cores · performance</text>
  <rect class="boxe" x="470" y="612" width="230" height="44" rx="5"/>
  <text class="tt" x="482" y="630">Focusrite Scarlett 2i4</text>
  <text class="ts" x="482" y="646">USB · Pro Audio · 4 out / 2 in</text>

  <!-- tracer -->
  <rect class="pnl" x="770" y="20" width="370" height="420" rx="8"/>
  <text class="tb" x="786" y="40">TRACER · USER SPACE</text>
  <rect class="boxe" x="790" y="52" width="340" height="52" rx="5"/>
  <text class="ttm" x="802" y="72">profiler/bin/wine-trace</text>
  <text class="ts" x="802" y="90">start / stop / run · finds pids · runs as root</text>
  <line class="ed" x1="789" y1="80" x2="703" y2="80" marker-end="url(#f1a)"/>
  <text class="ts" x="736" y="73" text-anchor="middle">finds pids</text>
  <rect class="box" x="790" y="124" width="160" height="78" rx="5"/>
  <text class="tt" x="802" y="143">bpftrace prototype</text>
  <text class="tm" x="802" y="160">wine-trace.bt</text>
  <text class="ts" x="802" y="176">one printf per program</text>
  <circle class="dot-ok" cx="806" cy="190" r="4"/>
  <text class="ts" x="815" y="194">in use today</text>
  <rect class="box" x="970" y="124" width="160" height="78" rx="5"/>
  <text class="tt" x="982" y="143">libbpf production</text>
  <text class="tm" x="982" y="160">wine-trace.bpf.c</text>
  <text class="ts" x="982" y="176">JIT check before attach</text>
  <circle class="dot-wip" cx="986" cy="190" r="4"/>
  <text class="ts" x="995" y="194">rewrite in progress</text>
  <line class="e" x1="870" y1="105" x2="870" y2="122" marker-end="url(#f1a)"/>
  <line class="e" x1="1050" y1="105" x2="1050" y2="122" marker-end="url(#f1a)"/>
  <text class="ts" x="960" y="117" text-anchor="middle">loads one backend</text>
  <path class="e" d="M870 203 V220 H1050 V203"/>
  <line class="e" x1="1005" y1="220" x2="1005" y2="483" marker-end="url(#f1a)"/>
  <text class="ts" x="993" y="330" text-anchor="end">attach to Live's pids:</text>
  <text class="tm" x="993" y="346" text-anchor="end">USDT · fentry · tracepoints</text>

  <!-- post-processing -->
  <line class="e" x1="1080" y1="536" x2="1080" y2="616" marker-end="url(#f1a)"/>
  <text class="ts" x="1070" y="603" text-anchor="end">ring buffer · CLOCK_MONOTONIC stamps</text>
  <rect class="pnl" x="870" y="610" width="270" height="216" rx="8"/>
  <rect class="box" x="886" y="618" width="238" height="48" rx="5"/>
  <text class="ttm" x="898" y="637">reduce.py</text>
  <text class="ts" x="898" y="654">block join · thread roles · lost events</text>
  <line class="e" x1="1005" y1="667" x2="1005" y2="684" marker-end="url(#f1a)"/>
  <rect class="box" x="886" y="686" width="238" height="48" rx="5"/>
  <text class="ttm" x="898" y="705">symbolize.py</text>
  <text class="ts" x="898" y="722">PE .pdata unwind → module + offset</text>
  <line class="e" x1="1005" y1="735" x2="1005" y2="752" marker-end="url(#f1a)"/>
  <rect class="boxe" x="886" y="754" width="238" height="62" rx="5"/>
  <text class="ttm" x="898" y="773">raw/interface/</text>
  <text class="tm" x="898" y="790">blocks.jsonl · threads.jsonl</text>
  <text class="tm" x="898" y="806">summary.json · tracer.json</text>
  <text class="ts" x="1005" y="846" text-anchor="middle">→ bench-report.py interface (Fig. 2)</text>

  <!-- one block, drawn to scale: 450 px per ms from x=70 -->
  <text class="tt" x="48" y="698">One audio block · 64 frames at 48 kHz</text>
  <text class="tp" x="60" y="714">block_start</text>
  <text class="tp" x="166" y="714">block_end</text>
  <polygon class="pr" points="81,721 86,726 81,731 76,726"/>
  <polygon class="pr" points="162,721 167,726 162,731 157,726"/>
  <rect class="sw" x="70" y="734" width="11" height="18"/>
  <rect class="sl" x="81" y="734" width="81" height="18"/>
  <rect class="ss" x="162" y="734" width="508" height="18"/>
  <text class="tonbar" x="121.5" y="747" text-anchor="middle">busy 180 µs</text>
  <text class="ts" x="416" y="747" text-anchor="middle">slack ≈ 1.13 ms</text>
  <path class="tk" d="M86 756 V766 M92 756 V766 M99 756 V766 M105 756 V766 M111 756 V766 M118 756 V766 M124 756 V766 M131 756 V766 M139 756 V766 M146 756 V766 M152 756 V766 M158 756 V766"/>
  <text class="ts" x="176" y="765">crossings from every thread are joined to this block</text>
  <line class="e" x1="70" y1="772" x2="760" y2="772"/>
  <path class="e" d="M70 772 V777 M295 772 V777 M520 772 V777 M745 772 V777"/>
  <text class="ts" x="70" y="790" text-anchor="middle">0</text>
  <text class="ts" x="295" y="790" text-anchor="middle">0.5 ms</text>
  <text class="ts" x="520" y="790" text-anchor="middle">1.0 ms</text>
  <text class="ts" x="745" y="790" text-anchor="middle">1.5 ms</text>
  <line class="dl" x1="670" y1="706" x2="670" y2="772"/>
  <text class="tt" x="676" y="718">deadline</text>
  <text class="ts" x="676" y="733">next cycle (next_nsec)</text>
  <text class="ts" x="48" y="814">late: the block ends after the deadline · near-late: slack under 15 % of the period</text>
  <text class="ts" x="48" y="830">Medians from the Focusrite sanity run (pw-top: wait 25 µs, busy 180 µs). All stamps use CLOCK_MONOTONIC.</text>
</svg>

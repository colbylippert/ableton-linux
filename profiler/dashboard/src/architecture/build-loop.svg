<svg xmlns="http://www.w3.org/2000/svg" class="arch-svg" viewBox="0 0 1160 670" role="img" aria-label="Machines and build. Code is edited and committed on the Windows workstation by Claude Code and its workflow subagents, shipped to the laptop as git bundles, built in a pinned rootless podman container, audited and installed as the Wine runtime. The golden snapshot holds the state every trial restores to. The planned agent loop on the laptop will build trials with wine-dev, run A/B and traced suites, and record results in the ledger and history that the dashboard shows.">
